<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Successful</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="theme-spider success-page">
  <div class="web-background" aria-hidden="true">
    <div class="web-orbit web-orbit-one"></div>
    <div class="web-orbit web-orbit-two"></div>
    <div class="spider"><span class="spider-body"></span></div>
  </div>
  <main class="container success-shell">
    <section class="booking-panel success-panel">
      <div class="success-scene" aria-hidden="true">
        <div class="web-trail web-trail-left"></div>
        <div class="web-trail web-trail-right"></div>
        <div class="hero-silhouette">
          <span class="hero-head"></span>
          <span class="hero-body"></span>
          <span class="hero-arm arm-left"></span>
          <span class="hero-arm arm-right"></span>
          <span class="hero-leg leg-left"></span>
          <span class="hero-leg leg-right"></span>
        </div>
      </div>
      <div class="form-card success-card">
        <h2>Booking Successful</h2>
        <p>Your appointment has been saved successfully.</p>
        <p>We look forward to seeing you.</p>
        <div class="form-actions success-actions">
          <a href="index.html" class="button-link">Back to booking page</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
