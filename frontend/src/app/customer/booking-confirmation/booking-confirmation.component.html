<app-web-background />

<main class="container success-shell">
  <section class="booking-panel success-panel">
    <div class="success-scene" aria-hidden="true">
      <div class="web-orbit web-left"></div>
      <div class="web-orbit web-right"></div>
      <div class="hero-silhouette">
        <span class="hero-head"></span>
        <span class="hero-body"></span>
        <span class="hero-arm arm-left"></span>
        <span class="hero-arm arm-right"></span>
        <span class="hero-leg leg-left"></span>
        <span class="hero-leg leg-right"></span>
      </div>
    </div>

    <div class="form-card success-card">
      <div class="confirmation-badge">Ready for your next set</div>
      <h2>You’re all set.</h2>
      <p class="success-copy">Your appointment is locked in and the chair is waiting.</p>

      <div class="summary-card confirmation-summary">
        <div class="summary-row">
          <span>Service</span>
          <strong>{{ booking.service || '—' }}</strong>
        </div>
        <div class="summary-row">
          <span>Date</span>
          <strong>{{ formatDate(booking.date) }}</strong>
        </div>
        <div class="summary-row">
          <span>Time</span>
          <strong>{{ booking.time || '—' }}</strong>
        </div>
        <div class="summary-row">
          <span>Name</span>
          <strong>{{ booking.customerName || '—' }}</strong>
        </div>
        <div class="summary-row">
          <span>Booking ref.</span>
          <strong>{{ booking.id || '—' }}</strong>
        </div>
      </div>

      <div class="form-actions success-actions">
        <button type="button" class="button-link primary-link" (click)="addToCalendar()">Add to Calendar</button>
        <a routerLink="/" class="button-link secondary-link">Back to Home</a>
      </div>
    </div>
  </section>
</main>
