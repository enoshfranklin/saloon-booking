<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saloon Booking Admin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Admin Booking Management</h1>
      <p>View and manage bookings for any date. Use your admin token to update or cancel appointments.</p>
    </header>

    <section class="booking-panel">
      <div class="form-card">
        <h2>Admin Actions</h2>
        <label>
          Admin token
          <input type="password" id="admin-token" placeholder="Enter admin token" />
        </label>
      </div>

      <div class="list-card">
        <div class="list-header">
          <h2>Bookings for <span id="selected-date-label"></span></h2>
          <button id="today-button" class="secondary">Today</button>
        </div>
        <div id="bookings-list" class="bookings-list"></div>
      </div>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
