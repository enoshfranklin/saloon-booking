<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salon Booking</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="theme-spider">
  <div class="web-background" aria-hidden="true"></div>
  <main class="container app-shell">
    <header class="page-header">
      <div class="brand-pill">The Red Room</div>
      <h1>Salon Booking</h1>
      <p>Book your makeover, swing into an open slot, and lock in your next appointment.</p>
    </header>

    <div class="booking-steps" aria-label="Booking progress">
      <span class="step active">Service</span>
      <span class="step">Date</span>
      <span class="step">Time</span>
      <span class="step">Confirm</span>
    </div>

    <section class="booking-panel">
      <div class="form-card">
        <h2>New Booking</h2>
        <form id="booking-form">
          <label>
            Date
            <input type="date" id="booking-date" required />
          </label>

          <label>
            Time slot
            <select id="booking-time" required></select>
          </label>

          <label>
            Customer name
            <input type="text" id="customer-name" placeholder="Jane Doe" required />
          </label>

          <label>
            Phone number (optional)
            <input type="tel" id="customer-phone" placeholder="(555) 123-4567" />
          </label>

          <label>
            Service (optional)
            <select id="service-type">
              <option value="">None</option>
              <option value="Haircut">Haircut</option>
              <option value="Beard">Beard</option>
              <option value="Haircut + Beard">Haircut + Beard</option>
              <option value="Color">Color</option>
              <option value="Style">Style</option>
            </select>
          </label>

          <div class="form-actions">
            <button type="submit" id="save-button">Save Booking</button>
          </div>
        </form>

      </div>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
